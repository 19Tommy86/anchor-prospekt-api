[pytest]
# aina/ er et selvstendig prosjekt med egne avhengigheter og egen testkjøring
# (aina/services/aina-core, se aina/Makefile og aina/.github/workflows/ci.yml).
# Uten dette forsøker rot-suiten å importere aina-pakken uten at den er
# installert, og kollapser i collection.
norecursedirs = aina *.egg .* _darcs build CVS dist node_modules venv {arch}
